[project]
name = "osahi"
version = "0.1.0"
description = "Reference implementation of the OSAHI agent execution lifecycle."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osahi-check = "osahi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
